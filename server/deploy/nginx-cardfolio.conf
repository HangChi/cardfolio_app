# 宝塔/Nginx 站点中添加此 location。外层站点必须已经启用 HTTPS。
# 若外层站点尚未强制 HTTPS，请在 server 块（80 端口）添加：
#   if ($scheme = http) { return 301 https://$host$request_uri; }
# 并在 HTTPS server 块启用 HSTS：
#   add_header Strict-Transport-Security "max-age=31536000" always;
location / {
    proxy_pass http://127.0.0.1:18080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;

    # 网关对 JSON 端点只接受 2MiB，只有附件上传走 64MiB；
    # 代理层统一放宽到 64m，超限由网关返回结构化 413。
    client_max_body_size 64m;
    proxy_connect_timeout 5s;
    proxy_send_timeout 120s;
    # 网关 requestTimeout 为 120s，push 批次预算 PUSH_DEADLINE_MS 默认 100s，
    # 必须保持 proxy_read_timeout > PUSH_DEADLINE_MS，避免代理先切断连接。
    proxy_read_timeout 120s;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
}
