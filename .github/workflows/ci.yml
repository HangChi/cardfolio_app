name: Flutter CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: flutter-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Format, analyze, test, migrate, and build
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.0
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test integration_test

      - name: Run static analysis
        run: flutter analyze --fatal-infos --fatal-warnings

      - name: Verify database migrations
        run: >-
          flutter test
          test/drift/app/migration_test.dart
          test/features/cards/data/card_database_migration_test.dart

      - name: Run test suite serially
        run: flutter test --concurrency=1

      - name: Build Android debug APK
        run: flutter build apk --debug
